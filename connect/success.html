<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Sisters Cafe</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        .success-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            text-align: center;
        }

        .success-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            box-shadow: var(--shadow-lg);
            border: 3px solid #28a745;
        }

        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }

        .success-title {
            color: #28a745;
            margin-bottom: 1rem;
        }

        .success-message {
            color: var(--text-color);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .session-info {
            background: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin: 1rem 0;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: var(--white);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            transition: var(--transition);
            margin: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--text-light);
        }

        .btn-secondary:hover {
            background: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">✅</div>
            <h1 class="success-title">Payment Successful!</h1>
            <div class="success-message">
                <p>Thank you for your purchase! Your payment has been processed successfully.</p>
                <p>You should receive a confirmation email shortly with your order details.</p>
            </div>
            
            <div id="session-details" class="session-info">
                <div>Session ID: <span id="session-id">Loading...</span></div>
            </div>

            <div style="margin-top: 2rem;">
                <a href="../connect-storefront.html" class="btn">
                    🛍️ Continue Shopping
                </a>
                <a href="../connect-dashboard.html" class="btn btn-secondary">
                    🏪 Admin Dashboard
                </a>
            </div>
        </div>
    </div>

    <script>
        // Get session ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        if (sessionId) {
            document.getElementById('session-id').textContent = sessionId;
            console.log('Payment successful for session:', sessionId);
        } else {
            document.getElementById('session-id').textContent = 'Not provided';
        }

        // Optional: You could fetch session details from your API here
        // to show more information about the purchase
    </script>
</body>
</html>
